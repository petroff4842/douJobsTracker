
name: DOU Jobs Tracker

on:
  schedule:
    - cron: '7,12,17,22,27,32,37,42,47,52,57 * * * *'
      timezone: 'Europe/Kyiv'

  workflow_dispatch:

concurrency:
  group: dou-jobs-tracker
  cancel-in-progress: false

jobs:
  check-vacancies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: jobs.db
          key: ${{ runner.os }}-jobs-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-jobs-db-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run bot
        run: npm start
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jobs.db
          key: ${{ runner.os }}-jobs-db-${{ github.run_id }}
